name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - name: Configure and build
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Verify the installed package
        run: |
          $sqpPrefix = Join-Path $env:RUNNER_TEMP 'sqphysics2d-install'
          cmake --install build --config Release --prefix $sqpPrefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tests/installed_consumer -B build/installed_consumer -A x64 "-DCMAKE_PREFIX_PATH=$sqpPrefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/installed_consumer --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/installed_consumer -C Release --output-on-failure --no-tests=error
